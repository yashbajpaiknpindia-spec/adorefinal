services:
  - type: web
    name: binance-copy-intelligence
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    autoDeployTrigger: off
    healthCheckPath: /health
    envVars:
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: MONITOR_INTERVAL_MINUTES
        value: "30"
      - key: SCHEDULED_PAGES_PER_MODE
        value: "1"
      - key: SCHEDULED_HISTORY_BATCH
        value: "5"
      - key: SCHEDULED_PATH_BATCH
        value: "10"
      - key: SECRET_KEY
        generateValue: true
      - key: APP_PASSWORD
        sync: false
      # Persistent DB is intentionally not auto-provisioned to avoid unintended costs.
      # To retain all future records reliably, configure DATABASE_URL to a dedicated persistent PostgreSQL instance.
